name: Newman API tests

on:
  push:
    branches: [ main, master ]

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run Newman
        run: npm test
      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: newman-reports
          path: reports/
